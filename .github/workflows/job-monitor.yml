name: New-grad PM job monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check career pages
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Official company pages/ATS backends are primary. Aggregators are opt-in only.
          ENABLE_DISCOVERY_SOURCES: "false"
          REQUEST_TIMEOUT_SECONDS: "8"
          LOG_LEVEL: INFO
        run: python job_monitor.py --state-file ci/state.json
      - name: Persist newly seen matching roles
        run: |
          current_month=$(date -u +%Y-%m)
          if [ "$(cat ci/heartbeat.txt 2>/dev/null || true)" != "$current_month" ]; then
            echo "$current_month" > ci/heartbeat.txt
          fi
          if git diff --quiet -- ci/state.json ci/heartbeat.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/state.json ci/heartbeat.txt
          git commit -m "chore: update job monitor state"
          git push
